services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - TALENTGRAPH_DB_PATH=/app/data/talentgraph.db
      - TALENTGRAPH_ZHAOPIN_COOKIE_PATH=/run/secrets/zhaopin.json
      - TALENTGRAPH_51JOB_HEADLESS=1
      - TALENTGRAPH_51JOB_BROWSER_ENABLED=1
      - TALENTGRAPH_51JOB_MAX_PAGES_PER_RUN=4
      - TALENTGRAPH_51JOB_REQUEST_DELAY_SECONDS=2.5,4.5
      - TALENTGRAPH_51JOB_NAVIGATION_TIMEOUT_SECONDS=20
      - TALENTGRAPH_51JOB_SELECTOR_TIMEOUT_SECONDS=5
      - TALENTGRAPH_LIEPIN_HEADLESS=1
      - TALENTGRAPH_LIEPIN_BROWSER_ENABLED=1
      - TALENTGRAPH_LIEPIN_MAX_PAGES_PER_RUN=4
      - TALENTGRAPH_LIEPIN_REQUEST_DELAY_SECONDS=2.5,4.5
      - TALENTGRAPH_LIEPIN_NAVIGATION_TIMEOUT_SECONDS=20
      - TALENTGRAPH_LIEPIN_SELECTOR_TIMEOUT_SECONDS=5
      - TALENTGRAPH_SUPPLEMENTAL_INITIAL_DELAY_SECONDS=20,60
      - TALENTGRAPH_SUPPLEMENTAL_STARTUP_MAX_AGE_HOURS=6
      - TALENTGRAPH_LIEPIN_ROBOTS_ACKNOWLEDGED=${TALENTGRAPH_LIEPIN_ROBOTS_ACKNOWLEDGED:-1}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./data/crawler-auth:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:4173"
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4173/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: talentgraph
      POSTGRES_USER: talentgraph
      POSTGRES_PASSWORD: talentgraph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentgraph -d talentgraph"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/talentgraph
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "talentgraph", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
